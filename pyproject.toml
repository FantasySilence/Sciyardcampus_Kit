[project]
name = "sciyardcampus-kit"
version = "0.1.0"
description = "数苑校园工具包：采集试卷、预览检查、导出 Word"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ocr: 需要本机 Tesseract 的集成测试",
    "device: 需要真实模拟器/adb 的集成测试（默认跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
